org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
android.overridePathCheck=true
kotlin.incremental=false
kotlinOptions.freeCompilerArgs=-Xallow-incompatible-kotlin-metadata-version

# ── 本地构建缓存 ──────────────────────────────────────────────────────
# 指向 D:\development\cache\gradle，避免每次构建重新下载 Gradle wrapper 和 Maven 依赖。
# 对应环境变量 GRADLE_USER_HOME，但在此处 fallback 配置确保 IDE 和 CLI 行为一致。
gradle.user.home=D\:\\development\\cache\\gradle
