[analysis]
  软件工程基础为计科专业的基础课程，核心内容有软件工程的工具、方法和过程，开课要求学生掌握面向对象分析与设计，为后续软件研发奠定基础。从试卷分析结果来看，考试成绩分布直方图基本呈偏态分布。极差96分偏大，平均分为58.0分；学生不及格34.4%比例较预期偏大，60分以下学生22人，4人考试0分；13人达到良好等级的学生，占比20.3%，显示试卷难度偏高。 试卷以银行ATM系统综合案例考查学生，需求验收测试、用例功能测试、面向对象建模、编码与测试等核心知识点，通过UML建模考查学生综合开发能力和实践操作技能。从各题得分来看，掌握较好的是需求、用例建模，反映学生对软件工程的基础掌握较好，能理解软件工程的基本原理、方法和技能。静态类图建模较好，反应学生能够掌握和应用面向对象思想。动态时序图建模部分掌握不理想，学生掌握差异较大。编码测试部分丢分最多，学生对正确的编码和测试掌握的最为薄弱，今后应加强编码和测试的讲解、实验和训练。EAGitOps平台即实验和考试环境的搭建、应用存在一些问题，后4题得分偏少。
 持续改进的方面主要有：重视DevOps新模式的应用，加强软件配置管理、Java项目构建、仓库源码管理、持续集成和持续部署；尤其加强SonarQube质检达到编码高质量。加强对学生必要的面向对象思想、数据库技术和软件开发素养的教学，加强对学生专业思想教育，确保软件工程基础课程顺利教学。
